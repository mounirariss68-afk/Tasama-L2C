kind = "web"
previewPath = "/"
title = "Tasama Mizan"
description = "Tasama's own finance demo with a Claude-powered assistant and confirmation-based actions."
version = "1.0.0"
id = "artifacts/tasama-mizan"
router = "path"

[[services]]
name = "web"
paths = ["/", "/api/health", "/api/world", "/api/actions", "/api/rev", "/api/reset", "/api/cognidocs", "/api/assistant"]
localPort = 22515

[services.development]
run = "pnpm --filter @workspace/tasama-mizan run dev"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/tasama-mizan", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"
BASE_PATH = "/"

[services.production.run]
args = ["pnpm", "--filter", "@workspace/tasama-mizan", "run", "serve"]

[services.production.run.env]
NODE_ENV = "production"
PORT = "22515"
BASE_PATH = "/"

[services.production.health.startup]
path = "/api/health"

[services.env]
PORT = "22515"
BASE_PATH = "/"
